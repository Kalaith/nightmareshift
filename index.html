<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightmare Shift | Web Hatchery</title>
    <meta name="description" content="A horror-themed taxi driving survival game. Drive supernatural passengers through the night, follow mysterious rules, and try to survive until dawn.">
    
    <!-- Shared CSS for consistent styling -->
    <link rel="stylesheet" href="../shared.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .game-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .game-title {
            color: #ff6b6b;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            margin: 0;
        }
        
        .game-subtitle {
            color: #888;
            font-size: 1rem;
            margin: 0;
        }
        
        .game-container {
            border: 2px solid #4ecdc4;
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.3);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .game-container canvas {
            display: block;
            image-rendering: pixelated;
        }
        
        .loading-message {
            color: #4ecdc4;
            font-size: 1.2rem;
            text-align: center;
            padding: 40px;
        }
        
        .game-controls {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            max-width: 600px;
        }
        
        .game-controls h3 {
            color: #f39c12;
            margin-bottom: 10px;
        }
        
        .game-controls kbd {
            background: #2d2d44;
            padding: 2px 8px;
            border-radius: 3px;
            border: 1px solid #4ecdc4;
            color: #4ecdc4;
        }
    </style>
</head>
<body>
    <div class="game-page">
        <h1 class="game-title">🚕 Nightmare Shift</h1>
        <p class="game-subtitle">A horror-themed taxi driving survival game</p>
        
        <div class="game-container">
            <canvas id="glcanvas" tabindex="1" width="1280" height="720"></canvas>
        </div>
        
        <div class="game-controls">
            <h3>Controls</h3>
            <p>
                <kbd>SPACE</kbd> Accept/Continue | 
                <kbd>ESC</kbd> Decline/Back | 
                <kbd>1-3</kbd> Select Route | 
                <kbd>Mouse</kbd> Click buttons
            </p>
        </div>
        
        <p class="loading-message" id="loading">Loading game...</p>
    </div>
    
    <!-- Miniquad WebGL Loader -->
    <script src="mq_js_bundle.js"></script>
    <script>
        // Hide loading message when game starts
        document.getElementById('glcanvas').addEventListener('contextmenu', e => e.preventDefault());
        
        // Load the WASM game
        load("nightmare_shift.wasm").then(() => {
            document.getElementById('loading').style.display = 'none';
        }).catch(err => {
            document.getElementById('loading').textContent = 'Failed to load game: ' + err;
            document.getElementById('loading').style.color = '#ff6b6b';
        });
    </script>
</body>
</html>
