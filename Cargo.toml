[package]
name = "nightmare_shift"
version = "0.1.0"
edition = "2021"
description = "A horror-themed taxi driving survival game"


[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
macroquad-toolkit = { path = "../macroquad-toolkit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "5.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Icon and version resource for the Windows executable; compiled only when
# host and target are both Windows (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
